name: Build ps4debug-NG

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04

    steps:
      - name: Baixar repositório
        uses: actions/checkout@v4

      - name: Instalar ferramentas
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential binutils

      - name: Compilar
        run: |
          (cd debugger && make clean)
          (cd kdebugger && make clean)
          (cd installer && make clean)
          bash build.sh

      - name: Salvar arquivo
        uses: actions/upload-artifact@v4
        with:
          name: ps4debug-ng
          path: ps4debug-ng.bin
